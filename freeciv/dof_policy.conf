# DOF policy of the built-in AI (the DOF agent, see DOF-AGENT.md).
# Principle: DOF-Core, https://github.com/UncleAndy/dof-core
#
# none | all | even | odd | 0,2,4      ('#' starts a comment)
#   none   classic AI everywhere (control arm of an A/B)
#   all    DOF everywhere
#   even   DOF on AI seats with even player index; odd - with odd index
#   0,2,4  explicit seat list
# The file is read at the start of every AI turn, so it can be changed without
# a restart; the environment variable DOF_POLICY_FILE overrides the path.
all
